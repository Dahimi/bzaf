[project]
name = "bzaf"
version = "0.0.1"
description = "A one-pass multi-answer question type for open decision models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "modal>=1.6.1",
    "numpy>=1.24",
]

[project.optional-dependencies]
data = ["datasets>=2.18"]   # only for UNFAIR-ToS (Hugging Face): uv sync --extra data

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]   # installed by default with `uv sync`

[project.scripts]
bzaf = "bzaf.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bzaf"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 150
src = ["src", "tests"]
extend-exclude = ["cloud/kev_serve.py"]   # vendored unchanged from Kev

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E702", "B905"]
