[project]
name = "bzaf"
version = "0.0.1"
description = "A one-pass multi-answer question type for open decision models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
data = ["datasets>=2.18"]   # only for UNFAIR-ToS (Hugging Face)
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
bzaf = "bzaf.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bzaf"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 150
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E702", "B905"]
